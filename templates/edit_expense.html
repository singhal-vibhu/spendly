{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Expense</h1>
    <p>Modify the details of your transaction.</p>
</div>

<div class="form-container">
    <form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST" class="expense-form">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                   value="{{ form_data.amount if form_data else expense.amount }}" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="" disabled {{ 'selected' if not (form_data and form_data.category or expense.category) }}>Select Category</option>
                {% for cat in categories %}
                <option value="{{ cat }}" {{ 'selected' if (form_data and form_data.category == cat) or (not form_data and expense.category == cat) }}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required
                   value="{{ form_data.date if form_data else expense.date }}">
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" id="description" name="description" maxlength="200"
                   value="{{ form_data.description if form_data else expense.description or '' }}" placeholder="What was this for?">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
            <button type="submit" class="btn-primary">Save Changes</button>
        </div>
    </form>
</div>

<style>
    .page-header {
        margin-bottom: 2rem;
        text-align: center;
    }
    .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: var(--paper-card);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: var(--shadow);
    }
    .expense-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .form-group label {
        font-weight: 500;
        font-size: 0.875rem;
    }
    .form-group input, .form-group select {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        font-size: 1rem;
    }
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 1rem;
    }
</style>
{% endblock %}
